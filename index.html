<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Named Colors + Emoji</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, sans-serif;
    background: #1a1a2e;
    color: #eee;
    padding: 2rem;
  }
  h1 {
    text-align: center;
    font-size: 1.8rem;
    margin-bottom: 0.4rem;
    letter-spacing: 0.05em;
  }
  p.sub {
    text-align: center;
    color: #aaa;
    margin-bottom: 1.2rem;
    font-size: 0.9rem;
  }
  input {
    display: block;
    margin: 0 auto 1.2rem;
    padding: 0.5rem 1rem;
    width: 280px;
    border-radius: 999px;
    border: 1px solid #444;
    background: #2a2a3e;
    color: #eee;
    font-size: 1rem;
    outline: none;
  }
  .format-tabs {
    display: flex;
    justify-content: center;
    gap: 0.4rem;
    margin-bottom: 2rem;
    flex-wrap: wrap;
  }
  .tab-btn {
    padding: 0.35rem 0.9rem;
    border-radius: 999px;
    border: 1px solid #555;
    background: #2a2a3e;
    color: #ccc;
    font-size: 0.8rem;
    font-family: monospace;
    cursor: pointer;
    transition: all 0.15s;
  }
  .tab-btn:hover { border-color: #888; color: #fff; }
  .tab-btn.active {
    background: #5a4fcf;
    border-color: #5a4fcf;
    color: #fff;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
    gap: 0.75rem;
  }
  .card {
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    transition: transform 0.15s;
    cursor: default;
  }
  .card:hover { transform: translateY(-3px); }
  .swatch {
    height: 70px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 4rem;
  }
  .info {
    background: rgba(0,0,0,0.45);
    padding: 0.45rem 0.6rem 0.5rem;
  }
  .color-name {
    font-size: 0.78rem;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: #eee;
    margin-bottom: 0.25rem;
  }
  .color-value {
    font-size: 0.68rem;
    color: #9db8e8;
    font-family: monospace;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .hidden { display: none; }
</style>
</head>
<body>
<h1>🎨 CSS Named Colors</h1>
<p class="sub">140 named colors — emoji, hex, rgb, rgba, hsl &amp; hsla</p>
<input type="text" id="search" placeholder="Search color or emoji…" oninput="filterColors()">

<div class="format-tabs">
  <button class="tab-btn active" data-fmt="hex" onclick="setFormat('hex')">hex</button>
  <button class="tab-btn" data-fmt="rgb" onclick="setFormat('rgb')">rgb()</button>
  <button class="tab-btn" data-fmt="rgba" onclick="setFormat('rgba')">rgba()</button>
  <button class="tab-btn" data-fmt="hsl" onclick="setFormat('hsl')">hsl()</button>
  <button class="tab-btn" data-fmt="hsla" onclick="setFormat('hsla')">hsla()</button>
</div>

<div class="grid" id="grid"></div>

<script>

  ["lightgreen","#90EE90","🌿"],["mediumspringgreen","#00FA9A","🍃"],["springgreen","#00FF7F","🌱"],
  ["mediumseagreen","#3CB371","🐢"],["seagreen","#2E8B57","🌊"],["forestgreen","#228B22","🌳"],
  ["green","#008000","🟢"],["darkgreen","#006400","🥦"],["yellowgreen","#9ACD32","🍈"],
  ["olivedrab","#6B8E23","🫑"],["olive","#808000","🫒"],["darkolivegreen","#556B2F","🪖"],

  ["cyan","#00FFFF","🩵"],["lightcyan","#E0FFFF","🧊"],["aqua","#00FFFF","💧"],

  ["cadetblue","#5F9EA0","⚓"],["steelblue","#4682B4","🔩"],
  ["lightsteelblue","#B0C4DE","🌥️"],["powderblue","#B0E0E6","☁️"],

  ["dodgerblue","#1E90FF","💙"],["cornflowerblue","#6495ED","🫐"],
  ["mediumslateblue","#7B68EE","🔵"],["royalblue","#4169E1","👑"],
  ["blue","#0000FF","🔵"],["mediumblue","#0000CD","🫐"],["darkblue","#00008B","🌑"],
  ["navy","#000080","⚓"],["midnightblue","#191970","🌌"],
  // Purples/Violets
  ["lavender","#E6E6FA","💜"],["thistle","#D8BFD8","🌾"],["plum","#DDA0DD","🍇"],
  ["violet","#EE82EE","🪻"],["orchid","#DA70D6","🌸"],["fuchsia","#FF00FF","💜"],
  ["magenta","#FF00FF","🎆"],["mediumorchid","#BA55D3","🔮"],
  ["mediumpurple","#9370DB","🟣"],["rebeccapurple","#663399","🫆"],
  ["blueviolet","#8A2BE2","⚡"],["darkviolet","#9400D3","🔮"],
  ["darkorchid","#9932CC","🍇"],["darkmagenta","#8B008B","🌂"],
  ["purple","#800080","🟣"],["indigo","#4B0082","🫙"],
  ["slateblue","#6A5ACD","💫"],["darkslateblue","#483D8B","🌙"],

  ["cornsilk","#FFF8DC","🌽"],["blanchedalmond","#FFEBCD","🥜"],

  ["wheat","#F5DEB3","🌾"],["burlywood","#DEB887","🪵"],

  ["sandybrown","#F4A460","🏖️"],["goldenrod","#DAA520","🌻"],
  ["darkgoldenrod","#B8860B","🏆"],["peru","#CD853F","🪨"],
  ["chocolate","#D2691E","🍫"],["saddlebrown","#8B4513","🪵"],
  ["sienna","#A0522D","🏔️"],["brown","#A52A2A","🐻"],["maroon","#800000","🍂"],
  // Whites/Light
  ["white","#FFFFFF","⬜"],["snow","#FFFAFA","❄️"],["honeydew","#F0FFF0","🍈"],
  ["mintcream","#F5FFFA","🌿"],["azure","#F0FFFF","🔷"],["aliceblue","#F0F8FF","🧿"],
  ["ghostwhite","#F8F8FF","👻"],["whitesmoke","#F5F5F5","💨"],

  ["oldlace","#FDF5E6","📜"],["floralwhite","#FFFAF0","🌼"],

  ["linen","#FAF0E6","🧺"],["lavenderblush","#FFF0F5","🌸"],["mistyrose","#FFE4E1","🌫️"],

  ["lightgrey","#D3D3D3","☁️"],["silver","#C0C0C0","🥈"],
  ["darkgray","#A9A9A9","🩶"],["darkgrey","#A9A9A9","🩶"],
  ["gray","#808080","🌫️"],["grey","#808080","🌫️"],
  ["dimgray","#696969","🪨"],["dimgrey","#696969","🪨"],
  ["lightslategray","#778899","🌥️"],["lightslategrey","#778899","🌥️"],
  ["slategray","#708090","🌊"],["slategrey","#708090","🌊"],
  ["darkslategray","#2F4F4F","🌑"],["darkslategrey","#2F4F4F","🌑"],
  ["black","#000000","⬛"],

function hexToRgb(hex) {
  return [
    parseInt(hex.slice(1,3),16),
    parseInt(hex.slice(3,5),16),
    parseInt(hex.slice(5,7),16)
  ];
}

function rgbToHsl(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const max = Math.max(r,g,b), min = Math.min(r,g,b);
  let h = 0, s = 0;
  const l = (max + min) / 2;
  if (max !== min) {
    const d = max - min;
    s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
    switch(max) {
      case r: h = ((g - b) / d + (g < b ? 6 : 0)) / 6; break;
      case g: h = ((b - r) / d + 2) / 6; break;
      case b: h = ((r - g) / d + 4) / 6; break;
    }
  }
  return [Math.round(h*360), Math.round(s*100), Math.round(l*100)];
}

function getValues(hex) {
  const [r,g,b] = hexToRgb(hex);
  const [h,s,l] = rgbToHsl(r,g,b);
  return {
    hex: hex.toUpperCase(),
    rgb: `rgb(${r}, ${g}, ${b})`,
    rgba: `rgba(${r}, ${g}, ${b}, 1)`,
    hsl: `hsl(${h}, ${s}%, ${l}%)`,
    hsla: `hsla(${h}, ${s}%, ${l}%, 1)`,
  };
}

let currentFormat = 'hex';

function setFormat(fmt) {
  currentFormat = fmt;
  document.querySelectorAll('.tab-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.fmt === fmt)
  );
  document.querySelectorAll('.color-value').forEach(el => {
    el.textContent = JSON.parse(el.dataset.vals)[fmt];
  });
}

const grid = document.getElementById('grid');

colors.forEach(([name, hex, emoji]) => {
  const vals = getValues(hex);
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.name = name;
  card.dataset.emoji = emoji;
  card.innerHTML = `
    <div class="swatch" style="background:${name}">${emoji}</div>
    <div class="info">
      <div class="color-name">${name}</div>
      <div class="color-value" data-vals='${JSON.stringify(vals)}'>${vals.hex}</div>
    </div>`;
  grid.appendChild(card);
});

function filterColors() {
  const q = document.getElementById('search').value.toLowerCase();
  document.querySelectorAll('.card').forEach(card => {
    const match = card.dataset.name.includes(q) || card.dataset.emoji.includes(q);
    card.classList.toggle('hidden', !match);
  });
}
</script>
</body>
</html>
